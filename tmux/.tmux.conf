# ==========================
# flamy — earthy/warm theme
# ==========================
set -g status-position bottom
set -g status-style "fg=#deb54e,bg=#3d3837"
set -g status-left-length 20
set -g status-left "#[fg=#b0aba1,bg=#3d3837][#S] "
set -g status-right ""
set -g window-status-style "fg=#b0aba1,bg=#3d3837"
set -g window-status-current-style "fg=#deb54e,bg=#3d3837"
set -g window-status-separator " "
set -g window-status-format " #I:#W#{?window_zoomed_flag,*Z,} "
set -g window-status-current-format " #I:#W#{?window_zoomed_flag,*Z,} "
set -g pane-border-style 'fg=#3d3837'
set -g pane-active-border-style 'fg=#deb54e'
set -g message-style 'fg=#1b1f20,bg=#deb54e,bold'
set -g mode-style 'fg=#1b1f20,bg=#deb54e,bold'
set -g clock-mode-colour '#deb54e'




bind-key j command-prompt -p "join pain from:" "join-pane -s '%%'"
bind-key s command-prompt -p "send pane to:" "join-pane -t '%%'"
bind-key C send-keys " | xclip -selection clipboard"

set-window-option -g mode-keys vi

# TPM (TMUX PLUGIN MANAGER)
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-logging'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-copycat'

# tmux-copycat removed — use built-in search (/) in copy mode instead

set -g @logging-key "P"
set -g @logging-key-end "L"
set -g @logging-path "~/tmux_logs/"

run '~/.tmux/plugins/tpm/tpm'

# sessionizer
bind-key -r a run-shell "tmux neww ~/.local/bin/tmux-sessionizer"
bind-key g choose-tree -s
