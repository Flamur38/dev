
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g default-shell /bin/bash
set -g history-limit 10000
set -g allow-rename off
set-window-option -g mode-keys vi
# set -g status-bg "#26A269" 
# set -g status-bg "#008000"
set -g status-style 'bg=#222222 fg=#5eacd3'
set -g window-status-format         "#[fg=#6a6a6a] #I:#W  "
set -g window-status-current-format "#[fg=#5eacd3,bold]#I:#W  "



# ==========================================================
# KEYBINDINGS
# ==========================================================

# Reload tmux config
bind r source-file ~/.tmux.conf \; display-message " config reloaded"


# Send current pane to another window
bind-key j command-prompt -p "join pain from:" "join-pane -s '%%'"
bind-key s command-prompt -p "send pane to:" "join-pane -t '%%'"

bind-key C send-keys " | xclip -selection clipboard"

# vim-like pane switching
bind -r ^ last-window
bind -r k select-pane -U
bind -r j select-pane -D
bind -r h select-pane -L
bind -r l select-pane -R

# ==========================================================
# TPM (TMUX PLUGIN MANAGER)
# ==========================================================

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-logging'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-copycat'

# tmux-copycat removed — use built-in search (/) in copy mode instead

set -g @logging-key "P"
set -g @logging-key-end "L"
set -g @logging-path "~/tmux_logs/"


run '~/.tmux/plugins/tpm/tpm'
