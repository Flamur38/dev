[colors]
; === Investigation palette ===
inv-bg       = #0a0a0a
inv-fg       = #646464
inv-red      = #b42828
inv-dim      = #1a1a1a
; === HTB palette ===
htb-bg       = #1a2332
htb-fg       = #a4b1cd
htb-green    = #c5f467
htb-cyan     = #2ee7b6
htb-red      = #ff3e3e
htb-dim      = #313f55
; === Active theme — swap comments to switch ===
bg           = ${colors.inv-bg}
fg           = ${colors.inv-fg}
accent       = ${colors.inv-red}
secondary    = ${colors.inv-red}
dim          = ${colors.inv-dim}

[bar/main]
monitor               =
width                 = 100%
height                = 46
offset-x              = 0
offset-y              = 0
radius                = 0
fixed-center          = true
bottom                = false
background            = ${colors.bg}
foreground            = ${colors.fg}
line-size             = 2
line-color            = ${colors.accent}
border-size           = 0
padding-left          = 2
padding-right         = 2
module-margin-left    = 1
module-margin-right   = 1
font-0                = Monospace:pixelsize=20;4
font-1                = Font Awesome 6 Free:style=Solid:pixelsize=20;4
font-2                = Font Awesome 6 Brands:pixelsize=20;4
modules-left          = i3
modules-center        = date
modules-right         = tun0 eth disk cpu memory tray
tray-position         = right
tray-padding          = 4
tray-maxsize          = 20
tray-background       = ${colors.bg}
separator             = %{F#3a3a3a}│%{F-}
wm-restack            = i3
override-redirect     = false
enable-ipc            = true
cursor-click          = pointer
cursor-scroll         = ns-resize

[module/i3]
type                     = internal/i3
format                   = <label-state> <label-mode>
index-sort               = true
wrapping-scroll          = false
label-focused            = %index%
label-focused-foreground = ${colors.accent}
label-focused-background = ${colors.dim}
label-focused-underline  = ${colors.accent}
label-focused-padding    = 1
label-unfocused          = %index%
label-unfocused-foreground = ${colors.fg}
label-unfocused-padding  = 1
label-urgent             = %index%
label-urgent-foreground  = ${colors.inv-red}
label-urgent-padding     = 1

[module/date]
type                  = internal/date
interval              = 1
date                  = %a %d %b
time                  = %H:%M:%S
format-prefix         = "󰥔 "
format-prefix-foreground = ${colors.accent}
label                 = %date%  %time%
label-foreground      = ${colors.fg}

; VPN tun0
[module/tun0]
type                  = custom/script
exec                  = ip addr show tun0 2>/dev/null | awk '/inet / {print $2}' | cut -d/ -f1 || echo "down"
interval              = 10
format-prefix         = "󰖂 "
format-prefix-foreground = ${colors.accent}
label                 = %output%
label-foreground      = ${colors.fg}

; Ethernet / first active IP
[module/eth]
type                  = custom/script
exec                  = ip route get 1.1.1.1 2>/dev/null | awk '{for(i=1;i<=NF;i++) if($i=="src") print $(i+1)}' || echo "down"
interval              = 10
format-prefix         = "󰈀 "
format-prefix-foreground = ${colors.fg}
label                 = %output%
label-foreground      = ${colors.fg}

; Disk
[module/disk]
type                  = internal/fs
mount-0               = /
interval              = 30
format-mounted-prefix         = "󰋊 "
format-mounted-prefix-foreground = ${colors.fg}
label-mounted         = %free%
label-mounted-foreground = ${colors.fg}

; CPU
[module/cpu]
type                  = internal/cpu
interval              = 2
format-prefix         = "󰍛 "
format-prefix-foreground = ${colors.accent}
label                 = %percentage%%
label-foreground      = ${colors.fg}

; Memory
[module/memory]
type                  = internal/memory
interval              = 2
format-prefix         = "󰘚 "
format-prefix-foreground = ${colors.accent}
label                 = %used% / %free%
label-foreground      = ${colors.fg}
; warn when less than 1G free
format-warn-prefix    = "󰘚 "
format-warn-prefix-foreground = ${colors.inv-red}
warn-percentage       = 90

[module/tray]
type                  = internal/tray
icon-size             = 20
icon-padding          = 4

[settings]
screenchange-reload   = true
pseudo-transparency   = false
