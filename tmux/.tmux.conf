set-option -a terminal-features 'xterm-256color:RGB'
set -sg escape-time 0
# set -g base-index 1
set -g allow-rename off

# # theme
# set -g status-fg cyan
# set -g status-bg '#333333'

# -------------------------------------------------
# NightOps Theme
# -------------------------------------------------

# Status bar
set -g status-style "fg=#D7DFEA,bg=#0B111B"

set -g status-left-length 30
set -g status-right-length 50

# Session name
set -g status-left '#[fg=#AF8BE8,bold] #S #[fg=#16202E]│ '

# Time / Date
set -g status-right '#[fg=#63C5D8]%H:%M #[fg=#16202E]│ #[fg=#66788D]%d %b '

# Windows
set -g window-status-format '#[fg=#66788D] #I:#W '

set -g window-status-current-format '#[fg=#D7DFEA,bold] #I:#W#{?window_zoomed_flag, ,} '

# Pane borders
set -g pane-border-style 'fg=#16202E'
set -g pane-active-border-style 'fg=#63C5D8'

# Messages
set -g message-style 'fg=#060B13,bg=#E6B46C,bold'

# Copy mode
set -g mode-style 'fg=#060B13,bg=#E6B46C,bold'

# Clock
set -g clock-mode-colour '#63C5D8'
# ---

bind-key j command-prompt -p "join pain from:" "join-pane -s '%%'"
bind-key s command-prompt -p "send pane to:" "join-pane -t '%%'"
bind-key C send-keys " | xclip -selection clipboard"

set-window-option -g mode-keys vi

# TPM (TMUX PLUGIN MANAGER)
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-logging'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-copycat'

# tmux-copycat removed — use built-in search (/) in copy mode instead

set -g @logging-key "P"
set -g @logging-key-end "L"
set -g @logging-path "~/tmux_logs/"

run '~/.tmux/plugins/tpm/tpm'

# sessionizer
bind-key -r a run-shell "tmux neww ~/.local/bin/tmux-sessionizer"
bind-key g choose-tree -s
