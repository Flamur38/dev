# ~/.tmux.conf
# SOC / IR minimal tmux configuration
# Clean, readable, low-noise, single-file setup

# ==========================================================
# TERMINAL & COLOR SUPPORT
# ==========================================================

# Use modern tmux terminfo with truecolor
set -g default-terminal "tmux-256color"

# Pass truecolor to applications
set -ga terminal-overrides ",xterm-256color:Tc,screen-256color:Tc"

# ==========================================================
# CORE BEHAVIOR
# ==========================================================

# Start window and pane numbering at 1
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows when one is closed
set -g renumber-windows on

# Default shell
set -g default-shell /bin/bash

# Scrollback history
set -g history-limit 10001

# Prevent programs from renaming windows
set -g allow-rename off

# Use vi keys everywhere
setw -g mode-keys vi

# ==========================================================
# KEYBINDINGS
# ==========================================================

# Reload tmux config
bind r source-file ~/.tmux.conf \; display-message "tmux config reloaded"

# Send current pane to another window
bind-key s command-prompt -p "Send pane to:" "join-pane -t '%%'"

# ==========================================================
# TPM (TMUX PLUGIN MANAGER)
# ==========================================================

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-logging'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-copycat'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Logging shortcuts
set -g @logging-key "P"
set -g @logging-key-end "L"
set -g @logging-path "~/tmux_logs/"

# ==========================================================
# STATUS BAR — SOC / IR MINIMAL THEME
# ==========================================================

# Enable status bar
set -g status on
set -g status-position bottom
set -g status-interval 5
set -g status-justify left

# Status bar colors
set -g status-style "bg=#0B1220,fg=#64748B"

# --------------------------
# Left: session name
# --------------------------
set -g status-left-length 40
set -g status-left "#[fg=#38BDF8]#S #[fg=#64748B]| "
# set -g status-left "#[fg=#38BDF8]#S #[fg=#64748B]|#{?client_prefix, #[fg=#FACC15] PREFIX #[fg=#64748B]|, } "


# --------------------------
# Right: date, time, host
# --------------------------
set -g status-right-length 80
set -g status-right "#[fg=#64748B]%Y-%m-%d #[fg=#2DD4BF]%H:%M #[fg=#64748B]| #[fg=#E6EDF3]#H "

# ==========================================================
# WINDOW LIST
# ==========================================================

# Inactive windows
setw -g window-status-style "fg=#64748B,bg=#0B1220"
setw -g window-status-format " #I:#W "

# Active window
# setw -g window-status-current-style "fg=#0B1220,bg=#38BDF8"
setw -g window-status-current-style "fg=#38BDF8,bg=#0B1220,bold"
setw -g window-status-current-format " #I:#W "

# ==========================================================
# PANES
# ==========================================================

# Pane borders
set -g pane-border-style "fg=#64748B"
set -g pane-active-border-style "fg=#38BDF8"

# ==========================================================
# MESSAGES & COMMAND PROMPTS
# ==========================================================

set -g message-style "fg=#E6EDF3,bg=#0B1220"
set -g message-command-style "fg=#2DD4BF,bg=#0B1220"

# ==========================================================
# COPY MODE (VI)
# ==========================================================

# Match highlighting
setw -g copy-mode-match-style "fg=#0B1220,bg=#FACC15"
setw -g copy-mode-current-match-style "fg=#0B1220,bg=#EF4444"

# ==========================================================
# QUIET MODE (SOC-FRIENDLY)
# ==========================================================

# Disable bells and activity notifications
set -g visual-bell off
set -g visual-activity off
set -g bell-action none

# ==========================================================
# INITIALIZE TPM (KEEP AT BOTTOM)
# ==========================================================

run '~/.tmux/plugins/tpm/tpm'
