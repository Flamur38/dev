set-option -a terminal-features 'xterm-256color:RGB'

set -g history-limit 10000
set -g allow-rename off

set -g base-index 1
set -sg escape-time 0

# ~/.tmux.conf

# ~/.tmux.conf

# Status bar colors
set -g status-style "bg=#333333,fg=#89DCEB"

# Left side — session name
set -g status-left "[#S] |"
set -g status-left-style "bg=#333333,fg=#89DCEB"

# Right side — date/time
set -g status-right " %m/%d | %H:%M "
set -g status-right-style "bg=#333333,fg=#89DCEB"

# Window list — center
# set -g status-justify centre
set -g status-justify left
setw -g window-status-format " #I:#W#F"
setw -g window-status-style "bg=#333333,fg=#89DCEB"
setw -g window-status-current-format " #I:#W#F"
setw -g window-status-current-style "bg=#333333,fg=#d8DEE9,bold"


bind-key j command-prompt -p "join pain from:" "join-pane -s '%%'"
bind-key s command-prompt -p "send pane to:" "join-pane -t '%%'"
bind-key C send-keys " | xclip -selection clipboard"

set-window-option -g mode-keys vi

# TPM (TMUX PLUGIN MANAGER)
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-logging'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-copycat'

# tmux-copycat removed — use built-in search (/) in copy mode instead

set -g @logging-key "P"
set -g @logging-key-end "L"
set -g @logging-path "~/tmux_logs/"


run '~/.tmux/plugins/tpm/tpm'
