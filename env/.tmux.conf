set-option -a terminal-features 'xterm-256color:RGB'

set -g history-limit 10000
set -g allow-rename off

set -g base-index 1
set -sg escape-time 0

# ───────────────────────────────────────────────────────────────────────────
# THEME GREEN
# fl4my_greeny tmux theme  ·  matches greeny Terminator profile
# fg=#18b118 · bg=#000000

# ── panes ──────────────────────────────────────────────────────────────────
set -g pane-border-style          "fg=#2e7a2e"
set -g pane-active-border-style   "fg=#18b118"
set -g pane-border-lines          single

# ── status bar ─────────────────────────────────────────────────────────────
set -g status                     on
set -g status-position            bottom
set -g status-style               "fg=#2e7a2e,bg=#000000"
set -g status-interval            5

# left: session name
set -g status-left-length         30
set -g status-left                "#[fg=#000000,bg=#18b118,bold] #S #[fg=#18b118,bg=#000000] "

# right: time
set -g status-right-length        30
set -g status-right               "#[fg=#2a5a2a] %H:%M #[fg=#18b118,bold]▊"

# windows
set -g window-status-format           "#[fg=#2a5a2a] #I:#W "
set -g window-status-current-format   "#[fg=#18b118,bold] #I:#W#{?window_zoomed_flag,*Z,} "
set -g window-status-separator        ""

# ── messages ───────────────────────────────────────────────────────────────
set -g message-style              "fg=#000000,bg=#18b118,bold"
set -g message-command-style      "fg=#18b118,bg=#000000"

# ── mode (copy) ────────────────────────────────────────────────────────────
set -g mode-style                 "fg=#000000,bg=#18b118"
# ───────────────────────────────────────────────────────────────────────────


