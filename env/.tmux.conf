
bind - split-window -v
bind | split-window -h

set-option -sg escape-time 10
set-option -g focus-events on
set-option -a terminal-features 'xterm-256color:RGB'

set -g history-limit 10000
set -g allow-rename off

unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix
# set -g status-style 'bg=#333333 fg=#5eacd3'
set -g base-index 1

# THEME
# ===============
set -g status on
set -g status-interval 5
set -g status-position bottom
set -g status-style "bg=#161b22,fg=#3d444d"

# left — session name
set -g status-left-length 40
set -g status-left "#[fg=#3d444d] #[fg=#cdd9e5,bold]#S #[fg=#21262d]| "

# right — host + date
set -g status-right-length 60
set -g status-right "#[fg=#3d444d]host #[fg=#58a6ff]'#H' #[fg=#3d444d]%% #[fg=#cdd9e5]%d %b %H:%M"

# windows — Z flag shown when zoomed, like tmux default
set -g window-status-format "#[fg=#3d444d] #I:#W#{?window_zoomed_flag,*Z,} "
set -g window-status-current-format "#[bg=#161b22,fg=#cdd9e5] #I:#W#{?window_zoomed_flag,#[fg=#58a6ff]*Z,} "
set -g window-status-separator "#[fg=#21262d]|"
# ================

bind-key j command-prompt -p "join pain from:" "join-pane -s '%%'"
bind-key s command-prompt -p "send pane to:" "join-pane -t '%%'"
bind-key C send-keys " | xclip -selection clipboard"

set-window-option -g mode-keys vi

# TPM (TMUX PLUGIN MANAGER)
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-logging'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-copycat'

# tmux-copycat removed — use built-in search (/) in copy mode instead

set -g @logging-key "P"
set -g @logging-key-end "L"
set -g @logging-path "~/tmux_logs/"


run '~/.tmux/plugins/tpm/tpm'
