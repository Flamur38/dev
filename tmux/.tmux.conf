set-option -a terminal-features 'xterm-256color:RGB'
set -sg escape-time 0
# set -g base-index 1
set -g allow-rename off



# ==========================
# HTB Theme
# ==========================
set -g status-position bottom
set -g status-style "fg=#a4b1cd,bg=#2e353e"
set -g status-left-length 20
set -g status-left "#[fg=#5FB4B4,bg=#2e353e,bold][#S] #[fg=#5b7092]|"
set -g status-right ""
set -g window-status-style "fg=#D8DEE9,bg=#2e353e"
set -g window-status-current-style "fg=#f9ae58,bg=#2e353e"
set -g window-status-separator ""
set -g window-status-format " #I:#W#{?window_zoomed_flag, [Z],} "
set -g window-status-current-format " #I:#W#{?window_zoomed_flag, [Z],} "
set -g pane-border-style 'fg=#313f55'
set -g pane-active-border-style 'fg=#2ee7b6'
set -g message-style 'fg=#1a2332,bg=#F9AE58,bold'
set -g mode-style 'fg=#1a2332,bg=#F9AE58'
set -g clock-mode-colour '#2ee7b6'
# ---

bind-key j command-prompt -p "join pain from:" "join-pane -s '%%'"
bind-key s command-prompt -p "send pane to:" "join-pane -t '%%'"
bind-key C send-keys " | xclip -selection clipboard"

set-window-option -g mode-keys vi

# TPM (TMUX PLUGIN MANAGER)
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-logging'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-copycat'

# tmux-copycat removed — use built-in search (/) in copy mode instead

set -g @logging-key "P"
set -g @logging-key-end "L"
set -g @logging-path "~/tmux_logs/"

run '~/.tmux/plugins/tpm/tpm'

# sessionizer
bind-key -r a run-shell "tmux neww ~/.local/bin/tmux-sessionizer"
bind-key g choose-tree -s
