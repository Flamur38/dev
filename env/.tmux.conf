
bind - split-window -v
bind | split-window -h

set-option -sg escape-time 10
set-option -g focus-events on
set-option -a terminal-features 'xterm-256color:RGB'

set -g history-limit 10000
set -g allow-rename off

set -g base-index 1

# THEME
# ===============
set -g status-style "bg=#1e6e1e,fg=#0a0a0a"
set -g status-left "#[bg=#1e6e1e,fg=#0a0a0a,bold] #S #[default]| "
set -g status-right "#[bg=#1e6e1e,fg=#0a0a0a] %d %b %H:%M "
# windows
set -g window-status-format "#[bg=#1e6e1e,fg=#0a0a0a] #I:#W#{?window_zoomed_flag,*Z,} "
set -g window-status-current-format "#[bg=#1e6e1e,fg=#ffffff,bold] #I:#W#{?window_zoomed_flag,*Z,} "
# ================

bind-key j command-prompt -p "join pain from:" "join-pane -s '%%'"
bind-key s command-prompt -p "send pane to:" "join-pane -t '%%'"
bind-key C send-keys " | xclip -selection clipboard"

set-window-option -g mode-keys vi

# TPM (TMUX PLUGIN MANAGER)
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-logging'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-copycat'

# tmux-copycat removed — use built-in search (/) in copy mode instead

set -g @logging-key "P"
set -g @logging-key-end "L"
set -g @logging-path "~/tmux_logs/"


run '~/.tmux/plugins/tpm/tpm'
