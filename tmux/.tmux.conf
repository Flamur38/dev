set-option -a terminal-features 'xterm-256color:RGB'
set -sg escape-time 0
# set -g base-index 1
set -g allow-rename off


# ── juliana tmux theme ───────────────────────────────────────
# bar #444e59 · above nvim #303841 and terminator #232a31

set -g status-position bottom
set -g status-justify left
# set -g status-style "fg=#a6acb9,bg=#444e59"
set -g status-style "fg=#a6acb9,bg=#2d343b"

# left: session in cyan, muted divider
set -g status-left-length 24
set -g status-left "#[fg=#5fb4b4,bg=#2d343b,bold][#S]#[fg=#ffffff,nobold] | "
set -g status-right ""

# windows: inactive muted, current bold yellow
set -g window-status-style "fg=#a6acb9,bg=#2d343b"
set -g window-status-current-style "fg=#f9ae58,bg=#2d343b,bold"
set -g window-status-separator ""
set -g window-status-format "#I:#W#{?window_zoomed_flag, [Z],} "
set -g window-status-current-format "#I:#W#{?window_zoomed_flag, [Z],} "

# activity / bell
set -g window-status-activity-style "fg=#fac761,bg=#2d343b"
set -g window-status-bell-style "fg=#ec5f66,bg=#2d343b,bold"

# panes: dim border, cyan when active
set -g pane-border-style "fg=#3f4750"
set -g pane-active-border-style "fg=#5fb4b4"

# messages / command prompt
set -g message-style "fg=#232a31,bg=#f9ae58,bold"
set -g message-command-style "fg=#232a31,bg=#f9ae58,bold"

# copy-mode selection + clock
set -g mode-style "fg=#232a31,bg=#f9ae58"
set -g clock-mode-colour "#5fb4b4"


bind-key j command-prompt -p "join pain from:" "join-pane -s '%%'"
bind-key s command-prompt -p "send pane to:" "join-pane -t '%%'"
bind-key C send-keys " | xclip -selection clipboard"

set-window-option -g mode-keys vi

# TPM (TMUX PLUGIN MANAGER)
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-logging'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-copycat'

# tmux-copycat removed — use built-in search (/) in copy mode instead

set -g @logging-key "P"
set -g @logging-key-end "L"
set -g @logging-path "~/tmux_logs/"

run '~/.tmux/plugins/tpm/tpm'

# sessionizer
bind-key -r a run-shell "tmux neww ~/.local/bin/tmux-sessionizer"
bind-key g choose-tree -s
