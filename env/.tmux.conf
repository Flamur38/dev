# ~/.tmux.conf
# SOC / IR minimal tmux configuration

# ==========================================================
# TERMINAL & COLOR SUPPORT
# ==========================================================

set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc,screen-256color:Tc"

# ==========================================================
# CORE BEHAVIOR
# ==========================================================

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g default-shell /bin/bash
set -g history-limit 10000
set -g allow-rename off
set -sg escape-time 10
set -g mouse off
setw -g mode-keys vi

# ==========================================================
# KEYBINDINGS
# ==========================================================

# Reload tmux config
bind r source-file ~/.tmux.conf \; display-message " config reloaded"

# Intuitive splits that stay in current path
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Send current pane to another window
bind-key s command-prompt -p "Send pane to:" "join-pane -t '%%'"

# ==========================================================
# TPM (TMUX PLUGIN MANAGER)
# ==========================================================

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-logging'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-copycat'

# tmux-copycat removed — use built-in search (/) in copy mode instead

set -g @logging-key "P"
set -g @logging-key-end "L"
set -g @logging-path "~/tmux_logs/"


run '~/.tmux/plugins/tpm/tpm'
