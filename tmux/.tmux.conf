set-option -a terminal-features 'xterm-256color:RGB'
set -sg escape-time 0
# set -g base-index 1
set -g allow-rename off


# Theme
set -g status-style "fg=#7060A0,bg=#160016"
set -g status-left '#[fg=#D0D0FF,bold] #S #[fg=#3a2050]│ '
set -g status-right '#[fg=#9080C0]%H:%M #[fg=#3a2050]│ #[fg=#7060A0]%d %b '
set -g window-status-format '#[fg=#3a2050] #I:#W '
set -g window-status-current-format '#[fg=#D0D0FF,bold] #I:#W#{?window_zoomed_flag, [Z],} '
set -g pane-border-style 'fg=#3a2050'
set -g pane-active-border-style 'fg=#9080C0'
set -g message-style 'fg=#160016,bg=#D0D0FF,bold'
set -g mode-style 'fg=#160016,bg=#D0D0FF,bold'
set -g clock-mode-colour '#9080C0'




bind-key j command-prompt -p "join pain from:" "join-pane -s '%%'"
bind-key s command-prompt -p "send pane to:" "join-pane -t '%%'"
bind-key C send-keys " | xclip -selection clipboard"

set-window-option -g mode-keys vi

# TPM (TMUX PLUGIN MANAGER)
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-logging'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-copycat'

# tmux-copycat removed — use built-in search (/) in copy mode instead

set -g @logging-key "P"
set -g @logging-key-end "L"
set -g @logging-path "~/tmux_logs/"

run '~/.tmux/plugins/tpm/tpm'

# sessionizer
bind-key -r a run-shell "tmux neww ~/.local/bin/tmux-sessionizer"
bind-key g choose-tree -s
