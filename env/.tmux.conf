# ~/.tmux.conf
# SOC / IR minimal tmux configuration
# Clean, readable, low-noise, single-file setup
# Theme: Juliana / Mariana (Sublime) on black

# ==========================================================
# TERMINAL & COLOR SUPPORT
# ==========================================================

set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc,screen-256color:Tc"

# ==========================================================
# CORE BEHAVIOR
# ==========================================================

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g default-shell /bin/bash
set -g history-limit 10000
set -g allow-rename off
set -sg escape-time 10
set -g mouse off
setw -g mode-keys vi

# ==========================================================
# KEYBINDINGS
# ==========================================================

# Reload tmux config
bind r source-file ~/.tmux.conf \; display-message " config reloaded"

# Intuitive splits that stay in current path
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Send current pane to another window
bind-key s command-prompt -p "Send pane to:" "join-pane -t '%%'"

# ==========================================================
# TPM (TMUX PLUGIN MANAGER)
# ==========================================================

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-logging'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-copycat'

# tmux-copycat removed — use built-in search (/) in copy mode instead

set -g @logging-key "P"
set -g @logging-key-end "L"
set -g @logging-path "~/tmux_logs/"

# ==========================================================
# JULIANA COLOR PALETTE
# ==========================================================

# Backgrounds
JL_BG="#000000"          # pure black — terminal bg
JL_BG_DIM="#0d1117"      # statusbar bg (just off-black)

# Foregrounds
JL_FG="#d8dee9"          # main fg (juliana fg2)
JL_FG_MUTED="#46525c"    # muted / structure (juliana fg4)
JL_FG_DIM="#2a3038"      # very dim / separators

# Accents
JL_BLUE="#5c99d6"        # blue2 — active window / hostname
JL_BLUE_BRIGHT="#95b2d6" # blue1 — session name
JL_CYAN="#5fb4b4"        # cyan2 — time
JL_GREEN="#99c794"       # green — clean git
JL_MAGENTA="#c695c6"     # magenta — prompt symbol
JL_ORANGE="#f97b58"      # orange — PREFIX indicator
JL_RED="#ec5f66"         # red2 — dirty git / errors
JL_YELLOW="#f9ae58"      # yellow2 — SSH indicator

# ==========================================================
# STATUS BAR
# ==========================================================

set -g status on
set -g status-position bottom
set -g status-interval 5
set -g status-justify left

set -g status-style "bg=$JL_BG_DIM,fg=$JL_FG_MUTED"

# --------------------------
# Left: session name + prefix indicator
# --------------------------
set -g status-left-length 40
set -g status-left "#[fg=$JL_BLUE_BRIGHT,bold]#S #[fg=$JL_FG_DIM]|#{?client_prefix,#[fg=$JL_ORANGE] PREFIX #[fg=$JL_FG_DIM]|, } "

# --------------------------
# Right: host, uptime
# --------------------------
set -g status-right-length 60
set -g status-right "#[fg=$JL_FG]#H #[fg=$JL_FG_DIM]· #[fg=$JL_CYAN]#(uptime -p | sed 's/up //')"

# ==========================================================
# WINDOW LIST
# ==========================================================

setw -g window-status-style "fg=$JL_FG_MUTED,bg=$JL_BG_DIM"
setw -g window-status-format " #I:#W "

setw -g window-status-current-style "fg=$JL_BLUE,bg=$JL_BG,bold"
setw -g window-status-current-format " #I:#W "

# ==========================================================
# PANES
# ==========================================================

set -g pane-border-style "fg=$JL_FG_DIM"
set -g pane-active-border-style "fg=$JL_BLUE"

# ==========================================================
# MESSAGES & COMMAND PROMPTS
# ==========================================================

set -g message-style "fg=$JL_FG,bg=$JL_BG_DIM"
set -g message-command-style "fg=$JL_CYAN,bg=$JL_BG_DIM"

# ==========================================================
# COPY MODE (VI)
# ==========================================================

setw -g copy-mode-match-style "fg=$JL_BG,bg=$JL_YELLOW"
setw -g copy-mode-current-match-style "fg=$JL_BG,bg=$JL_RED"

# ==========================================================
# QUIET MODE (SOC-FRIENDLY)
# ==========================================================

set -g visual-bell off
set -g visual-activity off
set -g bell-action none

# ==========================================================
# INITIALIZE TPM (KEEP AT BOTTOM)
# ==========================================================

run '~/.tmux/plugins/tpm/tpm'
