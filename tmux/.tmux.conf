set-option -a terminal-features 'xterm-256color:RGB'
set -sg escape-time 0
# set -g base-index 1
set -g allow-rename off

# # theme
# set -g status-fg cyan
# set -g status-bg '#333333'

# theme — fl4my palette
set -g status-fg '#76b28f'           # green
set -g status-bg '#0C0D21'           # dark navy
set -g status-left-length 30
set -g status-left '#[fg=#b07bc4,bold] #S #[fg=#1e1f35]│ '   # session name in purple
set -g status-right '#[fg=#3E7580] %H:%M #[fg=#1e1f35]│ #[fg=#76b28f]%d %b '

# active window title — orange, bold
set -g window-status-current-format '#[fg=#D8A06A,bold] #I:#W#{?window_zoomed_flag,*Z,} '
# inactive window title — dim
set -g window-status-format '#[fg=#2a2b45] #I:#W '

# pane borders
set -g pane-border-style 'fg=#1e1f35'
set -g pane-active-border-style 'fg=#76b28f'

# message bar
set -g message-style 'fg=#D8A06A,bg=#0C0D21,bold'


bind-key j command-prompt -p "join pain from:" "join-pane -s '%%'"
bind-key s command-prompt -p "send pane to:" "join-pane -t '%%'"
bind-key C send-keys " | xclip -selection clipboard"

set-window-option -g mode-keys vi

# TPM (TMUX PLUGIN MANAGER)
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-logging'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-copycat'

# tmux-copycat removed — use built-in search (/) in copy mode instead

set -g @logging-key "P"
set -g @logging-key-end "L"
set -g @logging-path "~/tmux_logs/"

run '~/.tmux/plugins/tpm/tpm'

# sessionizer
bind-key -r a run-shell "tmux neww ~/.local/bin/tmux-sessionizer"
bind-key g choose-tree -s
